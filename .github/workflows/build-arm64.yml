
name: HanniBomb ARM64 Android Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Rust target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Install build tools and Android NDK
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y binutils file zip unzip

          sdkmanager --install "platform-tools" "ndk;27.2.12479018"

          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOST_TAG=linux-x86_64" >> "$GITHUB_ENV"
          echo "ANDROID_API_LEVEL=29" >> "$GITHUB_ENV"

      - name: Validate source files
        shell: bash
        run: |
          set -euo pipefail

          test -f daemon/hannibombd.rs
          test -f daemon/build-android.sh
          test -f module.prop
          test -f service.sh
          test -f watcher.sh
          test -f common.sh
          test -f customize.sh
          test -f action.sh
          test -f uninstall.sh
          test -f webui.sh
          test -f config.conf
          test -f webroot/index.html

          sh -n daemon/build-android.sh
          sh -n service.sh
          sh -n watcher.sh
          sh -n common.sh
          sh -n customize.sh
          sh -n action.sh
          sh -n uninstall.sh
          sh -n webui.sh

      - name: Compile ARM64 daemon
        shell: bash
        run: |
          set -euo pipefail

          sh daemon/build-android.sh bin/hannibombd

          test -s bin/hannibombd
          readelf -h bin/hannibombd | grep -q 'AArch64'
          chmod 0755 bin/hannibombd

      - name: Assemble and validate KernelSU ZIP
        shell: bash
        run: |
          set -euo pipefail

          STAGE="$RUNNER_TEMP/hannibomb-module"
          ZIP="$GITHUB_WORKSPACE/HanniBomb_v1.5.1_KSU_Install.zip"

          mkdir -p "$STAGE/bin" "$STAGE/webroot"

          cp module.prop service.sh watcher.sh common.sh \
             customize.sh action.sh uninstall.sh webui.sh config.conf \
             "$STAGE/"

          cp -a webroot/. "$STAGE/webroot/"
          install -m 0755 bin/hannibombd "$STAGE/bin/hannibombd"

          cd "$STAGE"
          zip -qr "$ZIP" .

          cd "$GITHUB_WORKSPACE"

          unzip -t "$ZIP"
          unzip -p "$ZIP" module.prop > "$RUNNER_TEMP/module.prop"
          grep -q '^id=hannibomb$' "$RUNNER_TEMP/module.prop"

          unzip -Z1 "$ZIP" > "$RUNNER_TEMP/zip-list.txt"
          grep -Fxq 'bin/hannibombd' "$RUNNER_TEMP/zip-list.txt"
          grep -Fxq 'webroot/index.html' "$RUNNER_TEMP/zip-list.txt"
          grep -Fxq 'module.prop' "$RUNNER_TEMP/zip-list.txt"

          echo "===== ZIP CONTENTS ====="
          cat "$RUNNER_TEMP/zip-list.txt"
          echo "KernelSU ZIP validation passed."

      - name: Upload ARM64 daemon
        uses: actions/upload-artifact@v4
        with:
          name: HanniBomb-hannibombd-ARM64
          path: bin/hannibombd
          if-no-files-found: error
          retention-days: 14

      - name: Upload installable KernelSU ZIP
        uses: actions/upload-artifact@v4
        with:
          name: HanniBomb-v1.5.1-KSU-Install
          path: HanniBomb_v1.5.1_KSU_Install.zip
          if-no-files-found: error
          retention-days: 14
