
name: HanniBomb ARM64 Android Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Rust target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Install Android NDK
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install "ndk;27.2.12479018"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOST_TAG=linux-x86_64" >> "$GITHUB_ENV"
          echo "ANDROID_API_LEVEL=29" >> "$GITHUB_ENV"

      - name: Compile ARM64 daemon
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p bin
          sh daemon/build-android.sh bin/hannibombd
          test -s bin/hannibombd
          file bin/hannibombd
          readelf -h bin/hannibombd
          readelf -h bin/hannibombd | grep -q 'AArch64'
          chmod 0755 bin/hannibombd

      - name: Assemble KernelSU module ZIP
        shell: bash
        run: |
          set -euo pipefail

          STAGE="$RUNNER_TEMP/hannibomb-module"
          ZIP="$GITHUB_WORKSPACE/HanniBomb_v1.5.0_KSU_Install.zip"

          mkdir -p "$STAGE/bin" "$STAGE/webroot"

          cp module.prop service.sh watcher.sh common.sh \
             customize.sh action.sh uninstall.sh webui.sh config.conf "$STAGE/"

          cp -a webroot/. "$STAGE/webroot/"
          install -m 0755 bin/hannibombd "$STAGE/bin/hannibombd"

          cd "$STAGE"
          zip -qr "$ZIP" .

          cd "$GITHUB_WORKSPACE"
          unzip -t "$ZIP"
          unzip -l "$ZIP"
          unzip -p "$ZIP" module.prop | tee "$RUNNER_TEMP/module.prop"
          grep -q '^id=hannibomb$' "$RUNNER_TEMP/module.prop"
          unzip -l "$ZIP" | grep -q 'bin/hannibombd'
          unzip -l "$ZIP" | grep -q 'webroot/index.html'

      - name: Upload ARM64 daemon
        uses: actions/upload-artifact@v4
        with:
          name: HanniBomb-hannibombd-ARM64
          path: bin/hannibombd
          if-no-files-found: error
          retention-days: 14

      - name: Upload installable KernelSU ZIP
        uses: actions/upload-artifact@v4
        with:
          name: HanniBomb-v1.5.0-KSU-Install
          path: HanniBomb_v1.5.0_KSU_Install.zip
          if-no-files-found: error
          retention-days: 14
