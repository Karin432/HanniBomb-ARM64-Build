# HanniBomb v1stabil — conservative defaults; advanced writes are manual opt-in.
# Rust daemon is optional until an Android ARM64 binary is built and installed.
ENABLE_RUST_DAEMON=0
MODE=hybrid
PROFILE=balanced
AI_ADAPTIVE=1
AI_LOW_BATTERY=20
AI_THERMAL_STATUS_LIMIT=4
# CPU governor writes stay OFF until explicitly enabled in the WebUI.
ENABLE_GOVERNOR_CONTROL=0
GOVERNOR_BALANCED=schedutil
GOVERNOR_PERFORMANCE=performance
GOVERNOR_BATTERY=powersave
ENABLE_NOTIFICATIONS=1
# Foreground game auto-profile only checks explicitly listed package names; OFF by default.
ENABLE_GAME_AUTO_PROFILE=0
GAME_PACKAGES=
# Optional Android Wi-Fi scan throttling; unchanged by default.
ENABLE_WIFI_SCAN_THROTTLE=0
# Kernel TCP presets: explicit opt-in; DNS remains independent.
ENABLE_NETWORK_TWEAKS=0
NETWORK_PRESET=game
NETWORK_CUSTOM_CC=auto
NETWORK_CUSTOM_BUFFER=4194304
NETWORK_PING_TARGET=1.1.1.1
COLOR_SCALE=1.5
# Explicit DSCP marking by port; OFF by default.
ENABLE_DSCP=0
DSCP_PORT=27015
DSCP_VALUE=46
DSCP_PROTOCOL=udp
# Optional tc TBF egress shaping; works only when current root qdisc is noqueue.
ENABLE_TC_SHAPING=0
TC_INTERFACE=
TC_RATE=10
# Display saturation changes are manual only.
LOG_MAX_LINES=300
